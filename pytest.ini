[pytest]
# Adiciona o diretório atual (.) ao PYTHONPATH automaticamente
pythonpath = .

# Diretório padrão onde o pytest deve procurar os testes
testpaths = tests

# Padrões de descoberta de arquivos, classes e funções
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Flags padrão de execução:
# -v: mais verboso (mostra nome a nome dos testes)
# -s: não captura stdout/print (útil para depurar)
# --strict-markers: impede criação acidental de marcadores não declarados
addopts = -v --strict-markers --cov=app --cov-report=term-missing --cov-report=html

# Silencia warnings conhecidos de bibliotecas externas (opcional, deixa a saída limpa)
filterwarnings =
    ignore::DeprecationWarning